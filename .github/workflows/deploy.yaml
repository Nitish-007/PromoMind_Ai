name: Deploy PromoMindAI TO GCP Cloud RUn

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/deploy.yaml'
  workflow_dispatch:

# Avoid overlapping deployments from multiple pushes.
concurrency:
  group: promomind-production
  cancel-in-progress: false

jobs:

  deploy-backend:
    name: "Build & Deploy Backend"
    runs-on: ubuntu-latest

    outputs:
      backend_url: ${{ steps.get-backend-url.outputs.url }}
    
    env:
      REGION: ${{ vars.REGION }}
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REPOSITORY: ${{ vars.ARTIFACT_REPO }}
      SERVICE: ${{ vars.BACKEND_SERVICE_NAME }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Authenticate using GCP SA
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.DEPLOYER_SA_JSON }}
      
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      
      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ vars.REGION }}-docker.pkg.dev --quiet
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build and Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ vars.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REPO }}/${{ vars.BACKEND_SERVICE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ vars.BACKEND_SERVICE_NAME }}
          cache-to: type=gha,mode=max,scope=${{ vars.BACKEND_SERVICE_NAME }}
      
      - name: Deploy Backend to Cloud run
        run: |
          set -euo pipefail

          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${SERVICE}:${GITHUB_SHA}"

          gcloud run deploy ${SERVICE} \
            --image ${IMAGE} \
            --region ${REGION} \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --memory 1Gi \
            --cpu 1 \
            --update-env-vars="PROJECT_ID=${{ vars.GCP_PROJECT_ID }},GCP_PROJECT_ID=${{ vars.GCP_PROJECT_ID }},FIRESTORE_PROJECT_ID=${{ vars.GCP_PROJECT_ID }},GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }},VERTEX_AI_MODEL_NAME=${{ vars.VERTEX_AI_MODEL_NAME }},REGION=${{ vars.REGION }}"
      
      - name: Extract live backend url
        id: get-backend-url
        run: |
          set -euo pipefail

          URL="$(gcloud run services describe ${SERVICE} \
            --project "${PROJECT_ID}" \
            --region ${{ vars.REGION }} \
            --format='value(status.url)')"
          test -n "${URL}"
          echo "url=${URL}" >> $GITHUB_OUTPUT
          echo "Deployed Backend url: ${URL}"
        
  deploy-frontend:
    name: "Build & Deploy Frontend"
    needs: [deploy-backend]
    runs-on: ubuntu-latest

    env:
      REGION: ${{ vars.REGION }}
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REPOSITORY: ${{ vars.ARTIFACT_REPO }}
      SERVICE: ${{ vars.FRONTEND_SERVICE_NAME }}
      BACKEND_URL: ${{ needs.deploy-backend.outputs.backend_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Authenticate using GCP SA
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.DEPLOYER_SA_JSON }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
      
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      
      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ vars.REGION }}-docker.pkg.dev --quiet
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ vars.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REPO }}/${{ vars.FRONTEND_SERVICE_NAME }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_BACKEND_URL=${{ needs.deploy-backend.outputs.backend_url }}
            BACKEND_URL=${{ needs.deploy-backend.outputs.backend_url }}
          cache-from: type=gha,scope=promomind-frontend
          cache-to: type=gha,mode=max,scope=promomind-frontend
      
      - name: Deploy Frontend to Cloud run
        run: |
          set -euo pipefail

          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${SERVICE}:${GITHUB_SHA}"

          gcloud run deploy ${SERVICE} \
          --image ${IMAGE} \
          --region ${REGION} \
          --platform managed \
          --allow-unauthenticated \
          --port 3000 \
          --memory 512Mi \
          --cpu 1 \
          --update-env-vars="BACKEND_URL=${BACKEND_URL},NEXT_PUBLIC_BACKEND_URL=${BACKEND_URL}"
      
      - name: Get Frontend URL
        run: |
          set -euo pipefail

          URL="$(gcloud run services describe "${SERVICE}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --format='value(status.url)')"

          test -n "${URL}"
          echo "Frontend deployed: ${URL}"

